name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: anklav
          POSTGRES_USER: anklav
          POSTGRES_PASSWORD: anklav
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anklav -d anklav"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://anklav:anklav@localhost:5432/anklav
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: gitleaks/gitleaks-action@v2
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @anklav/api test:integration
      - run: pnpm generate:api
      - run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.ts
