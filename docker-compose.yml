services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        PGVECTOR_VERSION: 0.8.6
        PGVECTOR_REVISION: 8ee86c96f0fd72390f890aa8a336fda6d3ab4c6c
        PG_MAJOR: 18
    image: anklav-postgres:18.4-pgvector0.8.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anklav}
      POSTGRES_USER: ${POSTGRES_USER:-anklav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - anklav-postgres:/var/lib/postgresql

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/src/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-anklav}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anklav}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-anklav}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anklav}
      ANKLAV_SETUP_TOKEN: ${ANKLAV_SETUP_TOKEN:?Set ANKLAV_SETUP_TOKEN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      GITHUB_INTEGRATION_ENABLED: ${GITHUB_INTEGRATION_ENABLED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      PORT: 3000
      COOKIE_SECURE: "false"
      EVIDENCE_STORAGE_PATH: /var/lib/anklav/evidence
    volumes:
      - anklav-evidence:/var/lib/anklav/evidence
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  retrieval-worker:
    profiles: ["embedding"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/src/retrieval/worker.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-anklav}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anklav}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      EMBEDDING_WORKER_BATCH_SIZE: ${EMBEDDING_WORKER_BATCH_SIZE:-16}
      EMBEDDING_WORKER_POLL_MS: ${EMBEDDING_WORKER_POLL_MS:-2000}
      EMBEDDING_WORKER_LEASE_SECONDS: ${EMBEDDING_WORKER_LEASE_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  anklav-postgres:
  anklav-evidence:
